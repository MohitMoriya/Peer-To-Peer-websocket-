<html lang="en" dir="ltr">

    <meta name="twitter:title" content="DropDirect – Send Large Files Directly. No Uploads. No Limits." />

    <!-- ========== Performance: fonts (moved out of CSS @import to avoid a request chain) ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />

    <!-- Apply saved theme before first paint (prevents a white flash / layout shift) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #f5f5f7; }
      html[data-theme='dark'] { background: #000; }
    </style>

            "featureList": [

              {

              },
              {
                "@type": "Question",
                "name": "Is there a file size limit?",
                "acceptedAnswer": { "@type": "Answer", "text": "No. Because files are sent directly between browsers, you are only limited by your own device's memory and network speed." }
              },
              {
                "@type": "Question",
                "name": "Are my files saved on a server?",
                "acceptedAnswer": { "@type": "Answer", "text": "Absolutely not. Files travel directly from your device to the receiver's device. The signaling server is only used for the initial connection handshake and never sees your files." }
              },
              {
                "@type": "Question",
                "name": "Is DropDirect secure?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. All data sent through WebRTC Data Channels is encrypted end-to-end using DTLS (Datagram Transport Layer Security)." }
              },
              {
                "@type": "Question",
                "name": "How do I send a large file with DropDirect?",
                "acceptedAnswer": { "@type": "Answer", "text": "Click \"Create Secure Room\", share the 6-digit code, link or QR code with the receiver, and once they join, select your file and press Send. The file streams directly to their device." }
              },
              {
                "@type": "Question",
                "name": "Does DropDirect work on mobile phones?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. DropDirect works in any modern browser on Android, iPhone, Windows, macOS and Linux. No app installation is needed, and you can scan the QR code to join instantly." }
              },
              {
                "@type": "Question",
                "name": "Do both people need to stay online during the transfer?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Since there is no cloud storage, both the sender and the receiver must keep the room open until the transfer completes." }

    <!-- Fallback content for crawlers / users without JavaScript -->

      <main style="max-width:720px;margin:4rem auto;padding:0 1.5rem;font-family:Inter,system-ui,sans-serif;line-height:1.6;color:#1d1d1f">
        <h1>DropDirect – Free P2P File Sharing</h1>
        <p>Send large files directly from device to device. DropDirect is a free, private, end-to-end encrypted peer-to-peer file sharing app that runs in your browser — no uploads, no sign-up and no file size limits.</p>
        <h2>How it works</h2>
        <ol>
          <li>Create a secure room and get a 6-digit code.</li>
          <li>Share the code, link or QR code with the receiver.</li>
          <li>Select your file and send it directly — it never touches our servers.</li>
        </ol>
        <p><strong>Please enable JavaScript to use DropDirect.</strong></p>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
